<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2338"/>
      <stop offset="100%" stop-color="#040C16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="94" height="94" rx="19" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.8"/>
  <!-- Stylized Growth Tree with Wealth Coins -->
  <g filter="url(#glow)">
    <!-- Central Trunk -->
    <path d="M50 82 V48 M50 48 C42 42 32 45 28 38 M50 56 C58 50 68 53 72 46 M50 38 C46 30 50 22 50 18 C50 22 54 30 50 38" 
          fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Growth Coins / Leaves -->
    <circle cx="50" cy="18" r="7" fill="url(#goldGrad)"/>
    <circle cx="28" cy="38" r="6" fill="url(#goldGrad)"/>
    <circle cx="72" cy="46" r="6" fill="url(#goldGrad)"/>
    <circle cx="36" cy="27" r="5" fill="url(#goldGrad)"/>
    <circle cx="64" cy="33" r="5" fill="url(#goldGrad)"/>
    <!-- Inner Rupee Accent -->
    <path d="M47 16 h6 M47 19 h4.5 M47 16 c2.5 0 3 4 0 4 l3.5 3" fill="none" stroke="#040C16" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>